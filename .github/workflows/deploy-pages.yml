name: Deploy to GitHub Pages

# 主站部署在站点根路径，管理后台部署在 /admin/ 子路径（hash 路由）
# 未配置 VITE_API_BASE_URL secret 时：主站读内置 mock 数据，admin 为 mock 模式
# 配置该 secret（Render 后端地址，无尾斜杠）后：两端自动连接真实后端 API
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portfolio-admin/package-lock.json

      - name: Build main site
        run: |
          npm ci
          if [ -n "${{ secrets.VITE_API_BASE_URL }}" ]; then
            printf 'VITE_API_BASE_URL=%s\nVITE_API_PORTFOLIO_ENDPOINT=/api/portfolio/web\n' "${{ secrets.VITE_API_BASE_URL }}" > .env.production.local
            echo "Real backend enabled: ${{ secrets.VITE_API_BASE_URL }}"
          else
            echo "No VITE_API_BASE_URL secret, using built-in mock data"
          fi
          npm run build

      - name: Build admin console
        working-directory: portfolio-admin
        run: |
          npm ci
          if [ -n "${{ secrets.VITE_API_BASE_URL }}" ]; then
            printf 'VITE_API_BASE_URL=%s\n' "${{ secrets.VITE_API_BASE_URL }}" > .env.production.local
            echo "Admin real backend enabled"
          else
            echo "Admin built in mock mode"
          fi
          npm run build

      - name: Assemble Pages artifact (root = site, /admin = console)
        run: |
          mkdir -p _site/admin
          cp -r dist/. _site/
          cp -r portfolio-admin/dist/. _site/admin/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
